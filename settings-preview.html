<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>设置面板 · 重构预览</title>
<style>
  :root {
    --bg-base: #1c1c1e;
    --bg-surface: #2c2c2e;
    --bg-subtle: #3a3a3c;
    --panel-bg: rgb(50 50 52 / 0.80);
    --border: #3a3a3c;
    --border-soft: #2e2e30;
    --text-primary: #f5f5f7;
    --text-secondary: #aeaeb2;
    --brand: #0a84ff;
    --r-md: 8px;
    --r-sm: 6px;
    --r-xl: 14px;
    --fs-xs: 0.75rem;
    --fs-sm: 0.85rem;
    --fs-md: 1rem;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #2a2a2e, #1c1c1e);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    color: var(--text-primary);
  }
  .hint { position: fixed; top: 18px; color: var(--text-secondary); font-size: var(--fs-sm); }
  /* ---- 复刻后的设置面板 ---- */
  .modal-mask {
    position: relative; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .settings-modal {
    position: relative; display: flex; flex-direction: row; align-items: stretch;
    width: 720px; max-width: 94vw; padding: 0; overflow: hidden;
    background: var(--panel-bg); -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--border); border-radius: var(--r-xl);
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .settings-nav {
    flex: 0 0 168px; display: flex; flex-direction: column; gap: 2px;
    padding: var(--sp-3) var(--sp-2); background: var(--bg-subtle); border-right: 1px solid var(--border);
  }
  .settings-nav-title {
    font-size: var(--fs-xs); font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .06em; padding: var(--sp-1) var(--sp-2) var(--sp-2);
  }
  .nav-item {
    text-align: left; border: none; background: transparent; color: var(--text-primary);
    font-size: var(--fs-sm); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); cursor: pointer;
  }
  .nav-item:hover { background: rgba(127,127,127,.15); }
  .nav-item.active { background: var(--brand); color: #fff; font-weight: 600; }
  .settings-content {
    flex: 1 1 auto; min-width: 0; max-height: 86vh; overflow-y: auto;
    padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3);
  }
  .settings-page { display: flex; flex-direction: column; gap: var(--sp-3); }
  .settings-page h3 { margin: 0; font-size: var(--fs-md); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); color: var(--text-secondary); }
  input[type=text], input[type=password] {
    padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--bg-base); color: var(--text-primary); font-size: var(--fs-sm);
  }
  .modal-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; margin-top: var(--sp-2); }
  button.primary {
    background: var(--brand); color: #fff; border: none; padding: 7px 16px;
    border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-sm);
  }
  .key-status { font-size: var(--fs-sm); padding: var(--sp-1) var(--sp-2); border-radius: var(--r-sm); }
  .key-status.on { color: #1a7f37; background: rgba(26,127,55,.12); }
  .key-status.off { color: #b35900; background: rgba(179,89,0,.12); }
  .key-warn {
    font-size: var(--fs-sm); color: #b35900; background: rgba(179,89,0,.10);
    border: 1px solid rgba(179,89,0,.3); padding: var(--sp-2); border-radius: var(--r-sm); line-height: 1.5;
  }
  .cfg-check { flex-direction: row; align-items: flex-start; gap: 8px; color: var(--text-primary); }
  .cfg-check small { display: block; color: var(--text-secondary); font-size: var(--fs-xs); margin-top: 2px; }
  .settings-close {
    position: absolute; top: var(--sp-2); right: var(--sp-2); width: 28px; height: 28px;
    border: none; background: transparent; color: var(--text-secondary); font-size: 20px;
    line-height: 1; border-radius: var(--r-sm); cursor: pointer;
  }
  .settings-close:hover { background: var(--bg-subtle); color: var(--text-primary); }
  .pagenote { color: var(--text-secondary); font-size: var(--fs-xs); margin-top: 4px; }
</style>
</head>
<body>
  <div class="hint">设置面板重构预览 · 左侧模块导航（按钮式，非下拉）＋ 右侧独立配置页</div>
  <div class="modal-mask">
    <div class="settings-modal">
      <div class="settings-nav">
        <div class="settings-nav-title">设置</div>
        <button class="nav-item active" onclick="sel('model',this)">模型设置</button>
        <button class="nav-item" onclick="sel('key',this)">连接加密</button>
        <button class="nav-item" onclick="sel('general',this)">通用</button>
      </div>

      <div class="settings-content">
        <!-- 模型设置 -->
        <div class="settings-page" id="page-model">
          <h3>模型设置</h3>
          <label>模型厂商
            <select style="padding:7px 9px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-base);color:var(--text-primary);">
              <option>OpenAI</option><option>Anthropic</option><option>DeepSeek</option>
            </select>
          </label>
          <label>API Base URL
            <input type="text" placeholder="https://api.openai.com/v1" />
          </label>
          <label>模型名称
            <input type="text" placeholder="gpt-4o-mini" />
          </label>
          <label>API Key
            <input type="password" placeholder="已保存（留空保持不变）" />
          </label>
          <div class="modal-actions"><button class="primary">保存</button></div>
        </div>

        <!-- 连接加密 -->
        <div class="settings-page" id="page-key" style="display:none">
          <h3>连接加密密钥</h3>
          <div class="key-status off">当前状态：使用默认密钥（换机器/换人无法解密导出文件）</div>
          <div class="key-warn">
            ⚠️ 尚未配置自定义密钥。导入/导出用的 system-key 加密将退化为默认密钥，
            换机器后无法解密。建议在此设置一个自定义密钥（导出与导入两端使用相同密钥即可互通）。
          </div>
          <label>密钥口令（用于派生 AES 密钥；留空则重置回默认）
            <input type="password" placeholder="设置一个易记的口令" />
          </label>
          <div class="modal-actions"><button class="primary">保存密钥并重加密</button></div>
        </div>

        <!-- 通用 -->
        <div class="settings-page" id="page-general" style="display:none">
          <h3>通用</h3>
          <label class="cfg-check">
            <input type="checkbox" checked style="margin-top:3px" />
            <span>AI 内联补全（Tab 接受灰色建议）
              <small>输入停顿后由 LLM 续写 SQL；需先配置模型。默认关闭，以免产生延迟与费用。</small>
            </span>
          </label>
          <div class="pagenote">说明：模块切换用的是左侧按钮导航，不是 &lt;select&gt; 下拉。厂商选择保留下拉是因其为单选枚举，属合理用法。</div>
        </div>
      </div>

      <button class="settings-close" title="关闭">×</button>
    </div>
  </div>

  <script>
    function sel(page, el) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      ['model','key','general'].forEach(p => {
        document.getElementById('page-' + p).style.display = (p === page) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
