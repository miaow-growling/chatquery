[package]
name = "chatquery-desktop"
version = "0.1.0"
edition = "2021"
description = "ChatQuery desktop (Tauri)"
authors = ["chatquery"]
license = "MIT"

[[bin]]
name = "chatquery"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 勿在此启用 "devtools" feature：debug 构建自带调试菜单（Reload/Inspect），
# 启用该 feature 会让 release 构建也带上它。
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chatquery = { path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-std"] }
