name: Build Windows App

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击一键触发
  push:
    tags:
      - 'v*' # 推送新版本 tag 时自动触发打包

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Tauri App (Windows x64)
        run: |
          cd frontend
          npx tauri build --bundles nsis
          if (Test-Path "../src-tauri/target/release/chatquery.exe") {
            Copy-Item -Path "../src-tauri/target/release/chatquery.exe" -Destination "../src-tauri/target/release/bundle/nsis/智询_免安装绿色版.exe"
          }

      - name: Upload Windows Artifacts (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: 智询-Windows-安装包
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
