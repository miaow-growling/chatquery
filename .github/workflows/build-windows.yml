name: Build Windows App

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击一键触发
  push:
    tags:
      - 'v*' # 推送新版本 tag 时自动触发打包

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Tauri App (Windows x64)
        shell: pwsh
        run: |
          npx --prefix frontend tauri build --bundles nsis
          if (Test-Path "src-tauri/target/release/chatquery.exe") {
            Copy-Item -Path "src-tauri/target/release/chatquery.exe" -Destination "src-tauri/target/release/bundle/nsis/智询_免安装绿色版.exe"
          }

      - name: Upload Windows Artifacts (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: 智询-Windows-安装包
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows Artifacts to Aliyun OSS
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION || 'oss-cn-hangzhou' }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX || 'chatquery/releases' }}
          OSS_PUBLIC_DOMAIN: ${{ secrets.OSS_PUBLIC_DOMAIN }}
        run: |
          if (-not $env:OSS_ACCESS_KEY_ID -or -not $env:OSS_ACCESS_KEY_SECRET -or -not $env:OSS_BUCKET) {
            Write-Warning "未检测到完整 OSS Secrets 配置 (OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_BUCKET)，跳过 OSS 自动上传。"
          } else {
            node scripts/upload-oss.mjs
          }
