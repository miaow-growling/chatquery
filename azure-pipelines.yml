# Azure DevOps Pipeline for Tauri Windows App
# 默认关闭分支推送自动触发（避免随意提交浪费构建时长），仅支持：
# 1. 在 Azure 网页上手动点击「Run pipeline」触发
# 2. 推送版本标签（如 git push azure v0.1.0）时触发
trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'v*'

pool:
  vmImage: 'windows-latest'

variables:
  CARGO_TERM_COLOR: always

steps:
  # 1. 检出代码
  - checkout: self
    fetchDepth: 1

  # 2. 确保使用 Node.js 20
  - task: NodeTool@0
    displayName: '设置 Node.js 20'
    inputs:
      versionSpec: '20.x'

  # 3. 确保 Rust stable (x86_64-pc-windows-msvc) 工具链
  - powershell: |
      rustup default stable-x86_64-pc-windows-msvc
      rustup target add x86_64-pc-windows-msvc
      cargo --version
      rustc --version
    displayName: '检查并配置 Rust 工具链'

  # 4. 安装前端依赖
  - powershell: |
      Set-Location -Path "$(System.DefaultWorkingDirectory)\frontend"
      npm install --registry=https://registry.npmjs.org
    displayName: '安装前端依赖 (npm install)'

  # 5. 构建前端
  - powershell: |
      Set-Location -Path "$(System.DefaultWorkingDirectory)\frontend"
      npm run build
    displayName: '构建前端静态资源 (Vite)'

  # 6. 打包 Tauri Windows 应用 (在根目录执行，以便识别 src-tauri/tauri.conf.json)
  - powershell: |
      Set-Location -Path "$(System.DefaultWorkingDirectory)"
      npx --prefix frontend tauri build
    displayName: '打包 Tauri Windows 应用'

  # 7. 发布构建产物供网页下载
  - task: PublishBuildArtifacts@1
    displayName: '上传 Windows 安装包'
    inputs:
      PathtoPublish: 'src-tauri/target/release/bundle'
      ArtifactName: '智询-Windows安装包'
      publishLocation: 'Container'

