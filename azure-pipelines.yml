# Azure DevOps Pipeline for Tauri Windows App
trigger:
  branches:
    include:
      - main
      - feat/*
  tags:
    include:
      - 'v*'

pool:
  vmImage: 'windows-latest'

variables:
  CARGO_TERM_COLOR: always

steps:
  # 1. 检出代码
  - checkout: self
    fetchDepth: 1

  # 2. 安装 Node.js 20
  - task: NodeTool@0
    displayName: '安装 Node.js 20'
    inputs:
      versionSpec: '20.x'

  # 3. 安装 Rust 工具链
  - script: |
      curl -sSf -o rustup-init.exe https://win.rustup.rs
      rustup-init.exe -y --default-toolchain stable --default-host x86_64-pc-windows-msvc
      echo "##vso[task.prependpath]%USERPROFILE%\.cargo\bin"
    displayName: '安装 Rust (x86_64-pc-windows-msvc)'

  # 4. 安装前端依赖
  - script: |
      cd frontend
      npm ci
    displayName: '安装前端依赖 (npm ci)'

  # 5. 构建前端
  - script: |
      cd frontend
      npm run build
    displayName: '构建前端静态资源 (Vite)'

  # 6. 打包 Tauri Windows 应用 (EXE & MSI)
  - script: |
      cd frontend
      npx tauri build
    displayName: '打包 Tauri Windows 应用'

  # 7. 发布构建产物供网页下载
  - task: PublishBuildArtifacts@1
    displayName: '上传 Windows 安装包'
    inputs:
      PathtoPublish: 'src-tauri/target/release/bundle'
      ArtifactName: '智询-Windows安装包'
      publishLocation: 'Container'
