server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 安全头部
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 同源代理最新版本清单，避免浏览器跨域读取 OSS 被 CORS 拦截
    location = /chatquery/releases/latest.json {
        proxy_pass https://chatquery.oss-cn-shenzhen.aliyuncs.com/chatquery/releases/latest.json;
        proxy_ssl_server_name on;
        proxy_set_header Host chatquery.oss-cn-shenzhen.aliyuncs.com;
        proxy_set_header Accept application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML 首页始终不强缓存，确保用户随时打开都能看到最新的版本与发版信息
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 静态静态资源 (图片/字体/SVG) 长期缓存 30 天
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # 兜底路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查探针
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
