<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;

    --accent: #58a6ff;

    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo { font-weight: 700; font-size: 15px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .header-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(88,166,255,0.12);
    color: var(--accent);
    border: 1px solid rgba(88,166,255,0.25);
  }
  .header-right { display: flex; gap: 8px; }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .btn:hover { background: #21262d; border-color: #484f58; }
  .btn-accent { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn-accent:hover { background: #388bfd; }

  /* Main split */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* Panels */
  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .panel-php { flex: 1; border-right: 1px solid var(--border); }
  .panel-json { flex: 1; }
  .panel-rules { flex: 1.2; border-left: 1px solid var(--border); }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .panel-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--dim);
  }
  .panel-hint {
    font-size: 10px;
    color: var(--dim);
  }

  .panel-body {
    flex: 1;
    overflow: auto;
    padding: 16px;
  }

  /* Code blocks */
  .code-block {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
  }

  /* Syntax highlighting for PHP */
  .php-kw { color: var(--red); }       /* array, null, bool */
  .php-str { color: var(--green); }     /* strings */
  .php-int { color: var(--accent); }    /* integers */
  .php-class { color: var(--orange); }  /* class names */
  .php-prop { color: var(--purple); }   /* property keys */
  .php-brace { color: var(--dim); }      /* braces */

  /* Syntax highlighting for JSON */
  .json-k { color: var(--accent); }
  .json-s { color: var(--green); }
  .json-n { color: var(--orange); }
  .json-p { color: var(--dim); }

  /* Rule cards */
  .rule-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    background: var(--surface);
  }
  .rule-card:last-child { margin-bottom: 0; }
  .rule-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(88,166,255,0.05);
    border-bottom: 1px solid var(--border);
  }
  .rule-index {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .rule-route {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .rule-dest {
    font-size: 11px;
    color: var(--dim);
    margin-left: auto;
    font-family: var(--font-mono);
  }
  .rule-body { padding: 12px 14px; }
  .rule-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 24px;
  }
  .rule-field { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; }
  .rule-field-k { color: var(--dim); flex-shrink: 0; min-width: 90px; }
  .rule-field-v { font-family: var(--font-mono); font-size: 11px; color: var(--text); word-break: break-all; }
  .rule-field-v.null { color: var(--dim); font-style: italic; }
  .rule-field-v.bool { color: var(--orange); }
  .rule-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .rule-section-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }

  /* Placeholder table */
  .placeholder-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .placeholder-table th {
    text-align: left;
    padding: 4px 8px;
    color: var(--dim);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .placeholder-table td {
    padding: 4px 8px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    color: var(--text);
  }
  .placeholder-table tr:last-child td { border-bottom: 0; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* Toast */
  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    z-index: 100;
    animation: toastIn 0.2s ease, toastOut 0.2s ease 1.8s forwards;
    pointer-events: none;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-8px); } }

  /* Responsive */
  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .panel { flex: none; }
    .panel-php { max-height: 250px; border-right: 0; border-bottom: 1px solid var(--border); }
    .panel-json { max-height: 250px; }
    .panel-rules { flex: 1; border-left: 0; }
  }
</style>

// ---- Render PHP with highlighting ----
function highlightPHP(raw) {
  // Very simple tokenizer
  return raw
    .replace(/("(?:[^"\\]|\\.)*")/g, '<span class="php-str">$1</span>')
    .replace(/\b(N)(;)/g, '<span class="php-kw">$1</span>$2')
    .replace(/\b(b):(\d)(;)/g, '<span class="php-kw">$1</span>:$2$3')
    .replace(/O:(\d+):/g, 'O:<span class="php-int">$1</span>:')
    .replace(/:"([a-zA-Z_\\][a-zA-Z0-9_\\]*)":/g, (m, cls) => m.includes('yii') ? `:"<span class="php-class">${cls}</span>":` : m)
    .replace(/([a-z]+:)(\d+)/g, '$1<span class="php-int">$2</span>')
    .replace(/(s:\d+:")([^"]+)(")/g, '$1<span class="php-str">$2</span>$3')
    .replace(/([{}])/g, '<span class="php-brace">$1</span>');
}

// ---- Render JSON with highlighting ----
function highlightJSON(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json
    .replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span class="json-k">$1</span>:')
    .replace(/: (\d+)/g, ': <span class="json-n">$1</span>')
    .replace(/: (true|false)/g, ': <span class="json-n">$1</span>')
    .replace(/: (null)/g, ': <span class="json-n">$1</span>')
    .replace(/: ("[^"]*")/g, ': <span class="json-s">$1</span>')
    .replace(/([{}[\]])/g, '<span class="json-p">$1</span>')
    .replace(/(,)/g, '<span class="json-p">,</span>');
}

// ---- Render Rules ----
function renderRules(data) {
  const rules = data["0"]["0"];
  const cacheKey = data["0"]["1"];
  const outerNull = data["1"];

  let html = '<div style="font-size:11px;color:var(--dim);margin-bottom:14px">';

  html += '<code style="color:var(--accent)">[group_rules, cache_key]</code>';
  html += '</div>';

  // Cache info
  html += '<div style="padding:8px 12px;background:rgba(210,153,29,0.08);border:1px solid rgba(210,153,29,0.2);border-radius:6px;margin-bottom:14px;font-size:11px">';

  html += `<code style="font-family:var(--font-mono);color:var(--text)">${cacheKey}</code>`;

  html += '</div>';

  Object.entries(rules).forEach(([idx, rule]) => {
    const p = rule.properties;
    const idxNum = parseInt(idx) + 1;

    // Determine rule type color
    let accentColor = 'var(--accent)';
    let accentBg = 'rgba(88,166,255,0.08)';
    if (idxNum === 1) { accentColor = 'var(--green)'; accentBg = 'rgba(63,185,80,0.08)'; }
    if (idxNum === 2) { accentColor = 'var(--purple)'; accentBg = 'rgba(163,113,247,0.08)'; }
    if (idxNum === 3) { accentColor = 'var(--orange)'; accentBg = 'rgba(210,153,29,0.08)'; }

    html += `<div class="rule-card" style="border-color:${accentColor}33">`;
    html += `<div class="rule-header" style="background:${accentBg}">`;
    html += `<span class="rule-index" style="background:${accentColor}">${idxNum}</span>`;
    html += `<span class="rule-route" style="color:${accentColor}">${esc(p.name)}</span>`;
    html += `<span class="rule-dest">→ ${esc(p.route)}</span>`;
    html += '</div>';

    html += '<div class="rule-body">';
    html += '<div class="rule-fields">';

    // Display fields
    html += fieldRow('host', p.host);
    html += fieldRow('verb', p.verb);
    html += fieldRow('suffix', p.suffix);
    html += fieldRow('mode', p.mode);
    html += fieldRow('encodeParams', p.encodeParams, true);
    html += fieldRow('defaults', p.defaults && Object.keys(p.defaults).length ? JSON.stringify(p.defaults) : '{}');
    html += fieldRow('pattern', p.pattern);

    html += '</div>';

    // Placeholders
    if (p['*placeholders'] && Object.keys(p['*placeholders']).length) {
      html += '<div class="rule-section">';
      html += '<div class="rule-section-title">Placeholders (' + Object.keys(p['*placeholders']).length + ')</div>';
      html += '<table class="placeholder-table"><thead><tr><th>哈希值</th><th>参数名</th></tr></thead><tbody>';
      Object.entries(p['*placeholders']).forEach(([hash, name]) => {
        html += `<tr><td style="color:var(--dim)">${esc(hash.slice(0,16))}...</td><td>${esc(name)}</td></tr>`;
      });
      html += '</tbody></table>';
      html += '</div>';
    }

    // Param rules
    if (p['yii\\web\\UrlRule_paramRules'] && Object.keys(p['yii\\web\\UrlRule_paramRules']).length) {
      html += '<div class="rule-section">';
      html += '<div class="rule-section-title">参数验证规则</div>';
      html += '<table class="placeholder-table"><thead><tr><th>参数</th><th>正则</th></tr></thead><tbody>';
      Object.entries(p['yii\\web\\UrlRule_paramRules']).forEach(([param, regex]) => {
        html += `<tr><td style="color:var(--accent)">${esc(param)}</td><td style="font-size:10px">${esc(regex)}</td></tr>`;
      });
      html += '</tbody></table></div>';
    }

    // Route params
    if (p['yii\\web\\UrlRule_routeParams'] && Object.keys(p['yii\\web\\UrlRule_routeParams']).length) {
      html += '<div class="rule-section">';

      html += '<table class="placeholder-table"><thead><tr><th>键</th><th>值</th></tr></thead><tbody>';
      Object.entries(p['yii\\web\\UrlRule_routeParams']).forEach(([k, v]) => {
        html += `<tr><td style="color:var(--accent)">${esc(k)}</td><td>${esc(v)}</td></tr>`;
      });
      html += '</tbody></table></div>';
    }

    // Template
    html += '<div class="rule-section">';
    html += '<div class="rule-section-title">模板</div>';
    html += `<div style="font-family:var(--font-mono);font-size:11px;color:var(--green)">${esc(p['yii\\web\\UrlRule_template'])}</div>`;
    html += '</div>';

    // Route rule
    if (p['yii\\web\\UrlRule_routeRule']) {
      html += '<div class="rule-section">';
      html += '<div class="rule-section-title">路由正则</div>';
      html += `<div style="font-family:var(--font-mono);font-size:10px;color:var(--dim)">${esc(p['yii\\web\\UrlRule_routeRule'])}</div>`;
      html += '</div>';
    }

    html += '</div>';
    html += '</div>';
  });

  document.getElementById('rules-view').innerHTML = html;
}

function fieldRow(key, val, isBool) {
  if (val === null || val === undefined) {
    return `<div class="rule-field"><span class="rule-field-k">${esc(key)}</span><span class="rule-field-v null">null</span></div>`;
  }
  if (isBool) {
    return `<div class="rule-field"><span class="rule-field-k">${esc(key)}</span><span class="rule-field-v bool">${val}</span></div>`;
  }
  return `<div class="rule-field"><span class="rule-field-k">${esc(key)}</span><span class="rule-field-v">${esc(String(val))}</span></div>`;
}

function esc(s) {
  if (typeof s !== 'string') return String(s);
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- Copy ----
function copyPanel(panel) {
  let text;
  if (panel === 'php') {
    text = phpRaw;
  } else {
    text = JSON.stringify(deserializedData, null, 2);
  }
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(deserializedData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'yii-url-rules.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('JSON 已下载');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ---- Init ----
document.getElementById('php-code').innerHTML = highlightPHP(phpRaw);
document.getElementById('json-code').innerHTML = highlightJSON(deserializedData);
document.getElementById('json-size').textContent =
  JSON.stringify(deserializedData).length.toLocaleString() + ' bytes';
renderRules(deserializedData);
</script>
</body>
</html>
